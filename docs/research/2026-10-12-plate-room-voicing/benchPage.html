<!doctype html>
<!--
  The plate's render cost per quantum on a page's main thread (windsor#746),
  the loop bench.mjs runs in Node: stereo noise, L and R apart, the default
  space, sleep off, 48 kHz. Serve this page beside the bundles and call
  `await benchPlate('<bundle url>', 'plate' | 'room' | 'duck')` from the
  console or DevTools: the median of seven runs of 20 000 quanta, in
  microseconds, after two warm-up runs. `duck` flips the voicing every six
  quanta, so nearly every quantum is ducking.
-->
<meta charset="utf-8" />
<title>Plate bench</title>
<script>
  async function benchPlate(file, mode = 'plate', rounds = 7) {
    const source = await (await fetch(file)).text();
    class Base {
      constructor() {
        this.port = { postMessage() {}, onmessage: null };
      }
    }
    let Processor;
    new Function('AudioWorkletProcessor', 'sampleRate', 'registerProcessor', source)(
      Base,
      48000,
      (_name, cls) => {
        Processor = cls;
      },
    );
    const values = {};
    for (const d of Processor.parameterDescriptors) {
      values[d.name] = new Float32Array([d.defaultValue]);
    }
    if (values.voicing) values.voicing[0] = mode === 'room' ? 1 : 0;
    const proc = new Processor({ processorOptions: { sleep: false } });
    const BLOCK = 128;
    const inL = new Float32Array(BLOCK);
    const inR = new Float32Array(BLOCK);
    const outL = new Float32Array(BLOCK);
    const outR = new Float32Array(BLOCK);
    let seed = 1;
    const quanta = 20000;
    const run = () => {
      for (let q = 0; q < quanta; q++) {
        for (let i = 0; i < BLOCK; i++) {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          inL[i] = (seed / 0x80000000 - 1) * 0.25;
          seed = (seed * 1664525 + 1013904223) >>> 0;
          inR[i] = (seed / 0x80000000 - 1) * 0.25;
        }
        if (mode === 'duck' && values.voicing && q % 6 === 0) {
          values.voicing[0] = 1 - values.voicing[0];
        }
        outL.fill(0);
        outR.fill(0);
        proc.process([[inL, inR]], [[outL, outR]], values);
      }
    };
    run();
    run();
    const times = [];
    for (let r = 0; r < rounds; r++) {
      const t0 = performance.now();
      run();
      times.push(((performance.now() - t0) * 1000) / quanta);
    }
    times.sort((a, b) => a - b);
    return times[times.length >> 1];
  }
</script>
