<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Song Lanes Layout</title>
<!-- Mockup only: Windsor's Song tab with the part strip above it, re-framed so
     the lanes' left columns stop repeating what the strip already says. The
     song is the 16-part screenshot tacowars sent (100 BPM, 64 bars, 12/8,
     A major). The cells (compact Level knob with AUTO, M, S, the two lights,
     the lane value with ● ×, "+ Add lane", "Voice n/8", region and chord
     blocks) are today's, from songMixerCell.ts, songAutomationLane.ts,
     songLanes.ts and console.css; the frame is new. Layout "Today" redraws
     the left columns as they are now, for comparison. -->
<!-- Fonts, as the console loads them: Chakra Petch (Cadson Demak) and IBM Plex
     Sans and Mono (IBM), both under the SIL Open Font License 1.1, served by
     Google Fonts (fonts.google.com/specimen/Chakra+Petch,
     github.com/IBM/plex). The OFL permits use with AGPL-3.0 software. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
:root {
  --ground: #171b1e; --panel: #1f2529; --panel-hi: #262d32; --inset: #121618; --well: #0c0f10;
  --line: #2c3439; --line-bright: #3d4950; --ink: #dce3e3; --ink-dim: #8b9a9e; --ink-faint: #5e6b70;
  --carrier: #e0a44e; --modulator: #5fa8a0; --return: #9c7bd0; --seq: #cc7a9c; --hot: #d2643c;
  --f-panel: 'Chakra Petch', 'IBM Plex Sans', system-ui, sans-serif;
  --f-ui: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 3px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0b0d0e; color: var(--ink); font-family: var(--f-ui); font-size: 13px; -webkit-font-smoothing: antialiased; }

/* ---------- mockup chrome (not part of the design) ---------- */
.tb { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 16px; background: #0b0d0e; border-bottom: 1px solid var(--line); }
.tb .grp { display: flex; gap: 0; align-items: center; }
.tb .lbl { font: 600 10px var(--f-panel); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-right: 8px; }
.tb button { font: 600 11px var(--f-panel); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; margin-left: -1px; }
.tb button:first-of-type { border-radius: var(--r) 0 0 var(--r); }
.tb button:last-child { border-radius: 0 var(--r) var(--r) 0; }
.tb button.on { background: var(--carrier); color: #1a1408; border-color: var(--carrier); }
.tb button .rec { font-size: 9px; letter-spacing: .1em; opacity: .75; }
.tb .scale { font: 11px var(--f-num); color: var(--ink-faint); }
.notes { max-width: 1180px; margin: 14px 16px 4px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); line-height: 1.5; color: var(--ink-dim); }
.notes h2 { font: 700 15px var(--f-panel); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin: 0 0 6px; }
.notes b { color: var(--ink); font-weight: 600; }
.notes ol, .notes ul { margin: 6px 0 0; padding-left: 20px; }
.notes li { margin-bottom: 3px; }
.notes .todo { color: var(--carrier); }
.stage-wrap { padding: 14px 16px 40px; }
.stage { position: relative; transform-origin: 0 0; }
.screen-cap { font: 11px var(--f-num); color: var(--ink-faint); margin: 0 0 6px; }
.screen-cap b { color: var(--carrier); font-weight: 500; }
.screen { position: relative; overflow-y: auto; overflow-x: hidden; background: var(--ground); outline: 1px solid var(--line-bright); }
body.solo .tb, body.solo .notes, body.solo .screen-cap { display: none; }
body.solo .stage-wrap { padding: 0; }
body.solo .screen { outline: none; }
.stand-in { outline: 1px dashed var(--return); outline-offset: 2px; }
.tag-new { font: 700 8.5px var(--f-panel); letter-spacing: .12em; color: var(--return); text-transform: uppercase; }

/* ---------- console pieces (as today) ---------- */
.btn { font: 600 11px var(--f-panel); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--inset); border: 1px solid var(--line-bright); border-radius: var(--r); padding: 6px 11px; white-space: nowrap; }
.sel { font: 13px var(--f-ui); color: var(--ink); background: var(--inset); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 26px 5px 8px; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel::after { content: '▾'; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--ink-dim); font-size: 11px; }
.hint { color: var(--ink-faint); font-size: 11.5px; line-height: 1.45; margin: 0; }
.seg { display: flex; gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; }
.seg span { min-width: 44px; text-align: center; background: var(--inset); padding: 5px 8px; font: 600 10px var(--f-panel); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-dim); }
.seg span.on { background: var(--carrier); color: #1a1408; }

/* header: tabs in the transport row, the part strip on its own row (#527) */
.head { display: flex; flex-direction: column; gap: 8px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.head .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { font: 12px var(--f-num); color: var(--ink); background: var(--inset); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; white-space: nowrap; }
.chip small { font: 600 9px var(--f-panel); letter-spacing: .1em; color: var(--ink-faint); margin-left: 4px; }
.chip.on { background: var(--modulator); color: #0d1716; border-color: var(--modulator); }
.cpu { display: flex; align-items: center; gap: 8px; }
.cpu i { display: block; width: 46px; height: 5px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
.cpu i::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 22%; background: var(--modulator); }
.recdot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-bright); }
.tabs { display: flex; }
.tabs span { font: 600 11px var(--f-panel); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); background: var(--inset); border: 1px solid var(--line); padding: 7px 14px; margin-left: -1px; }
.tabs span.on { background: var(--carrier); color: #1a1408; border-color: var(--carrier); }

/* the part strip (console.css, windsor#520) */
.pstrip { display: flex; align-items: stretch; gap: 4px; flex: 1; min-width: 0; }
.pscroll { display: flex; gap: 3px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.pscroll::-webkit-scrollbar { display: none; }
.pstrip.over .pscroll { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%); }
.pnav, .plist { display: none; align-items: center; justify-content: center; width: 22px; background: var(--inset); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink-dim); font: 600 14px var(--f-panel); }
.plist { width: 26px; font-size: 11px; }
.pstrip.over .pnav, .pstrip.over .plist { display: flex; }
.pm { display: flex; gap: 3px; }
.pm .btn { display: flex; align-items: center; padding: 0 10px; font-size: 15px; }
.pchip { flex: 1 0 70px; min-width: 70px; max-width: 150px; position: relative; background: var(--inset); border: 1px solid var(--line); border-left: 3px solid var(--tone); border-radius: var(--r); padding: 4px 7px 3px; line-height: 1.15; cursor: pointer; }
.pchip:hover { background: var(--panel-hi); }
.pchip .n { display: block; font: 600 11px var(--f-panel); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pchip .k { font: 500 9.5px var(--f-ui); color: var(--ink-faint); white-space: nowrap; }
.pchip.on { background: var(--carrier); border-color: var(--carrier); }
.pchip.on .n, .pchip.on .k { color: #1a1408; }
.pchip .dot { position: absolute; right: 5px; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--modulator); opacity: 0; }
.pchip.on .dot { background: #1a1408; }
/* proposal: the Song mixer's two lights at chip size */
.pchip.mt { padding-right: 12px; }
.pchip .cl { position: absolute; right: 3px; top: 5px; display: flex; flex-direction: column; gap: 3px; }
.pchip .cl i { display: block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--line); }
.pchip .cl .clip { background: color-mix(in srgb, var(--hot) 16%, var(--inset)); cursor: default; }
.pchip .cl .clip.lit { background: var(--hot); border-color: var(--hot); box-shadow: 0 0 5px rgba(210,100,60,.7); cursor: pointer; }
.pchip .cl .act { background: rgb(30,40,34); }
.pchip.on .cl i { border-color: rgba(26,20,8,.55); }

/* the lane toolbar (windsor#349) */
.atb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px 0; }
.atb .tg { display: flex; align-items: center; gap: 6px; }
.atb .tl { font: 600 9px var(--f-panel); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.atb .sel { font-size: 11px; padding: 3px 22px 3px 6px; }

/* ---------- the Song view ---------- */
.lanes-scroll { overflow-x: auto; padding: 12px 14px 16px; scrollbar-width: thin; }
.lanes { position: relative; display: flex; flex-direction: column; gap: 4px; width: max-content; }
.grow { display: flex; gap: 8px; align-items: flex-start; }
.fz { position: sticky; left: 0; z-index: 3; background: var(--ground); flex: none; width: var(--fz);
  box-shadow: -14px 0 0 var(--ground), 8px 0 0 var(--ground), -14px 4px 0 var(--ground), 8px 4px 0 var(--ground), 0 4px 0 var(--ground); }
.tls { display: flex; flex-direction: column; gap: 4px; flex: none; width: var(--tlw); }

/* timeline cells (as today) */
.ruler { display: flex; height: 22px; border-bottom: 1px solid var(--line-bright); position: relative; }
.ruler-bar { position: relative; flex: none; border-left: 1px solid var(--line-bright); font: 10px var(--f-num); color: var(--ink-dim); }
.ruler-bar span { position: absolute; left: 4px; top: 2px; }
.loop-strip { height: 12px; }
.lane { position: relative; height: 40px; background: var(--inset); border: 1px solid var(--line); border-radius: var(--r); background-image: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px var(--bar)); background-position: -1px 0; cursor: pointer; }
.lane.selected { border-color: var(--carrier); }
.hblk { position: absolute; top: 3px; bottom: 3px; background: var(--panel-hi); border: 1px solid var(--line-bright); border-top: 3px solid var(--modulator); border-radius: var(--r); padding: 2px 6px; font-family: var(--f-panel); display: flex; flex-direction: column; line-height: 1.15; overflow: hidden; }
.hblk b { font-size: 11px; font-weight: 600; white-space: nowrap; }
.hblk small { font: 8.5px var(--f-num); color: var(--ink-faint); white-space: nowrap; }
.hblk.narrow { padding: 0 2px; }
.hblk.playing { border-color: var(--carrier); border-top-color: var(--modulator); }
.reg { position: absolute; top: 3px; bottom: 3px; display: flex; align-items: center; gap: 5px; padding: 0 6px; border-radius: var(--r); border: 1px solid var(--modulator); background-color: rgba(95,168,160,.2); color: var(--ink); font: 10px var(--f-panel); font-variant: small-caps; letter-spacing: .05em; white-space: nowrap; overflow: hidden; }
.reg.perc { border-color: var(--carrier); background-color: rgba(224,164,78,.17); }
.reg.cyc { background-image: repeating-linear-gradient(90deg, rgba(220,227,227,.22) 0 1px, transparent 1px var(--cyc)); }
.reg.selected { box-shadow: 0 0 0 1px var(--carrier); border-color: var(--carrier); }
.reg .gl { flex: none; font: 11px var(--f-ui); line-height: 1; color: var(--carrier); font-variant: normal; }
.auto-lane { position: relative; height: 56px; overflow: hidden; border-radius: var(--r); background-color: var(--inset); background-image: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px var(--bar)); background-position: -1px 0; }
.auto-ghost { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line-bright); border-right: 1px dashed var(--line-bright); background: rgba(220,227,227,.035); }
.auto-lane svg { position: absolute; top: 0; left: 0; display: block; }
.auto-fill { fill: var(--lane-c); fill-opacity: .14; }
.auto-line { fill: none; stroke: var(--lane-c); stroke-width: 1.6; stroke-linejoin: round; }
.auto-dot { fill: var(--inset); stroke: var(--lane-c); stroke-width: 1.6; }
.auto-add-lane { height: 30px; }
.ph-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--carrier); box-shadow: 0 0 6px var(--carrier); z-index: 2; pointer-events: none; }
.ph-label { position: absolute; top: 1px; font: 9px var(--f-num); color: var(--carrier); z-index: 2; }

/* frozen cells (as today) */
.lane-name { display: flex; align-items: center; gap: 6px; padding: 0 6px; border-radius: var(--r); border: 1px solid transparent; font-family: var(--f-panel); cursor: pointer; min-width: 0; }
.lane-name b { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.lane-name small { font: 9px var(--f-num); color: var(--ink-faint); letter-spacing: .04em; }
.lane-name .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.lane-name.selected { border-color: var(--carrier); background: var(--panel-hi); }
.lane-name.ruler-name { justify-content: flex-end; cursor: default; }
.lane-name.ruler-name small { font-size: 9px; }
button.tri { flex: none; width: 17px; height: 18px; margin: 0 -4px; padding: 0; font: 10px system-ui, sans-serif; line-height: 1; color: var(--ink-faint); border: 1px solid transparent; border-radius: var(--r); background: none; cursor: pointer; }
button.tri:hover { border-color: var(--line-bright); color: var(--ink); }
button.tri.open { color: var(--carrier); }
.auto-badge { flex: none; margin-left: auto; padding: 0 5px; border: 1px solid rgba(224,164,78,.45); border-radius: 8px; font: 9px var(--f-num); line-height: 14px; color: var(--carrier); white-space: nowrap; }
.lane-name.has-badge .nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix-cell { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 0 2px; min-width: 0; }
.mix-head { justify-content: flex-start; gap: 6px; font: 600 10px var(--f-panel); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }
.mix-toggle { flex: none; width: 22px; height: 22px; padding: 0; border: 1px solid transparent; border-radius: var(--r); background: none; color: var(--ink-dim); font-size: 12px; line-height: 1; }
.mix-switches { display: flex; gap: 3px; }
.mix-btn { width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; font: 600 10px var(--f-panel); color: var(--ink); background: var(--inset); border: 1px solid var(--line-bright); border-radius: var(--r); }
.mix-lights { display: flex; flex: none; flex-direction: column; align-items: center; gap: 4px; }
.mix-clip, .mix-activity { display: block; width: 10px; height: 10px; border: 1px solid var(--line); border-radius: 50%; }
.mix-clip { background: color-mix(in srgb, var(--hot) 16%, var(--inset)); }
.mix-clip.lit { background: var(--hot); border-color: var(--hot); box-shadow: 0 0 6px rgba(210,100,60,.7); cursor: pointer; }
.mix-activity { background: rgb(30,40,34); }
.knob.compact { display: grid; grid-template-columns: auto auto; align-items: center; justify-items: start; column-gap: 3px; row-gap: 1px; padding: 2px 4px 2px 2px; border-radius: var(--r); flex: none; }
.knob.compact svg { grid-row: span 2; display: block; }
.knob .dial-face { fill: var(--inset); stroke: var(--lock-color); }
.knob .dial-track { stroke: var(--line-bright); stroke-width: 3; fill: none; stroke-linecap: round; }
.knob .dial-arc { stroke: var(--lock-color); stroke-width: 3; fill: none; stroke-linecap: round; }
.knob .dial-pin { stroke: var(--lock-color); stroke-width: 2; stroke-linecap: round; }
.knob .knob-val { font: 10px var(--f-num); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 4ch; line-height: 12px; }
.knob .knob-auto { padding: 0 4px; border-radius: 6px; background: var(--lock-color); color: var(--ground); font: 600 7.5px var(--f-panel); letter-spacing: .14em; line-height: 11px; }
.auto-chip { flex: none; align-self: stretch; width: 3px; margin: 8px 2px; border-radius: 2px; background: var(--lane-c); }
.auto-name { gap: 4px; padding-left: 8px; cursor: default; }
.auto-name b, .auto-name small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.auto-name b { font-size: 11px; }
.auto-name small { text-transform: uppercase; }
.auto-mix { gap: 4px; padding: 0 4px; }
.auto-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 10px var(--f-num); font-variant-numeric: tabular-nums; color: var(--lane-c); }
.auto-buttons { display: flex; flex: none; gap: 3px; }
.auto-btn { width: 20px; height: 20px; padding: 0; border: 1px solid var(--line-bright); border-radius: var(--r); background: var(--panel-hi); color: var(--ink-dim); font: 10px system-ui, sans-serif; line-height: 1; }
.auto-btn.on { background: var(--lane-c); border-color: var(--lane-c); color: #14181a; }
.auto-picker { font: 11px var(--f-ui); color: var(--ink); background: var(--inset); border: 1px solid var(--line-bright); border-radius: var(--r); height: 22px; padding: 0 20px 0 6px; display: flex; align-items: center; position: relative; white-space: nowrap; }
.auto-picker::after { content: '⌄'; position: absolute; right: 6px; top: 1px; font-size: 11px; color: var(--ink-dim); }
.auto-count { font: 9px var(--f-num); color: var(--ink-faint); white-space: nowrap; }

/* Today: two frozen columns, names then mixer */
.t-fz { display: flex; flex-direction: column; gap: 4px; }
.t-row { display: grid; grid-template-columns: 120px 132px; column-gap: 8px; }
.t-row > .lane-name { overflow: hidden; }
.t-row > .auto-add { padding-left: 8px; }
.t-row > .auto-add .auto-picker { width: 100%; }
.t-row > .auto-count-cell { display: flex; align-items: center; padding: 0 4px; }

/* ---------- Proposal: one frozen column per part ---------- */
.p-fz { display: grid; grid-template-columns: var(--tabw) minmax(0, 1fr); column-gap: 4px; row-gap: 4px; }
.p-fz.psel { outline: 1px solid var(--carrier); outline-offset: 2px; border-radius: 2px; }
.p-fz > :not(.ptab) { grid-column: 2; }
.ptab { grid-column: 1; border-radius: 2px; background: linear-gradient(var(--pc) 0 40px, color-mix(in srgb, var(--pc) 15%, var(--ground)) 40px); display: flex; justify-content: center; cursor: pointer; }
.ptab b { font: 600 11px var(--f-num); color: #14181a; line-height: 40px; letter-spacing: -.02em; }
.idc .ptab { background: var(--pc); }
.idc .ptab b { display: none; }
.p-part { display: grid; grid-template-columns: 50px auto auto auto; align-items: center; justify-content: space-between; gap: 4px; padding: 0 2px; height: 40px; border-radius: var(--r); cursor: pointer; }
.p-fz.psel .p-part { background: var(--panel-hi); }
.p-fold { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.p-fold button.tri { margin: 0; }
.p-fold .auto-badge { margin: 0; }
.p-lane { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; column-gap: 6px; align-items: center; height: 56px; padding: 0 2px 0 4px; }
.p-lane .auto-chip { margin: 8px 0; }
.p-lane .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; font-family: var(--f-panel); }
.p-lane .nm b { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-lane .nm small { font: 9px var(--f-num); color: var(--ink-faint); letter-spacing: .04em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-lane .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.p-add { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 2px 0 4px; }
.p-add .auto-picker { width: 104px; }
.p-cell { display: flex; align-items: center; height: 100%; padding: 0 6px; font-family: var(--f-panel); }
.p-head { justify-content: space-between; padding: 0 2px; }
</style>
</head>
<body>
<div class="tb" id="tb"></div>
<div class="notes" id="notes"></div>
<div class="stage-wrap"><div class="screen-cap" id="cap"></div><div class="stage" id="stage"><div class="screen" id="screen"></div></div></div>
<script>
'use strict';
// ---------------------------------------------------------------- state
const SCREENS = {
  '1366': { w: 1366, h: 960, label: 'iPad Pro 12.9″ (1366×960)' },
  '1440': { w: 1440, h: 800, label: 'MacBook Air (1440×800)' },
  '2560': { w: 2560, h: 1300, label: '27″ 4K (2560×1300)' },
};
const S = { layout: 'prop', id: 'num', lights: 'dot', screen: '1440', zoom: 1, sel: 0, fit: true, notes: true, solo: false, full: false };
(function readHash() {
  for (const p of location.hash.slice(1).split('&')) {
    if (p === 'today') S.layout = 'today';
    if (p === 'colour') S.id = 'colour';
    if (p === 'meters') S.lights = 'meters';
    if (SCREENS[p]) S.screen = p;
    if (/^sel\d+$/.test(p)) S.sel = Number(p.slice(3));
    if (/^z\d+$/.test(p)) S.zoom = Number(p.slice(1)) / 100;
    if (p === 'solo') { S.solo = true; S.fit = false; }
    if (p === 'full') S.full = true;
  }
})();

// ---------------------------------------------------------------- data: the screenshot's song

  <li><b>Part identity</b> (toolbar). <b>Number tab</b> (recommended): a 20 px tab in the part's colour with its 1-based number, matching the chip's <i>n · kind</i>. It runs down the part's open lanes too, so a part's lanes read as one block. <b>Colour only</b>: just the edge. Today there are only two part colours (teal for pitched, amber for Euclid), so in a long song colour alone can't tell lanes apart. That's why the number is recommended.</li>
  <li><b>Selection wraps the whole part.</b> In the frozen column, one amber outline goes around the part's row, all its open lanes and its "+ Add lane" row. Click a chip or a part row (or its lane) and the selection moves. The chip's highlight follows. Try Pulse I (folded) and Mallet I (open), or ▸ on any part.</li>
  <li><b>Chip lights</b> (toolbar). <b>Note dot</b>: one dot, top right, as built. <b>Meters</b>: the Song mixer's green activity light and red clip latch drawn small on every chip, so you can see them on every tab. A click on a lit red light clears it, as in the mixer. <span class="todo">Proposal pending a measurement: on the Parts and Mixer tabs this polls every part's meter, where today only the Song tab's visible rows are polled.</span></li>
  <li><b>Today</b> (Layout) redraws the left columns as they are now, for comparison.</li></ol>
  <ul><li><b>Moved:</b> the "n lanes" badge now sits under ▸ instead of right of the name. Each lane's name and kind sit beside their value. The part's kind line (<i>chord</i>, <i>figure</i>…) is dropped here, because the chip shows it. Nothing I couldn't place.</li>
  <li><b>Unchanged:</b> <b>▸ Mixer</b> still expands every strip, and the column grows by its knob columns as today. The rows keep their heights (40 / 56 / 30 px), and the timeline, regions and harmony lane are today's.</li>
  <li><b>Decided:</b> a click on the number tab selects the part and does not fold it (▸ folds). Colour only was not chosen, so it needs no more colours.</li></ul>
  <p class="hint" style="margin-top:8px">The frame shows the screen at its real CSS size and scrolls inside, so what you see without scrolling is what fits. The data is the screenshot's song at its zoom (26.5 px a bar). Lanes the screenshot shows folded are invented so ▸ can open them, and the curves are simple polylines. <span style="outline:1px dashed var(--return);padding:0 4px">Dashed purple</span> marks a stand-in.</p>`;
}

// ---------------------------------------------------------------- render
function toolbar() {
  const b = (on, txt, act) => `<button class="${on ? 'on' : ''}" data-act="${act}">${txt}</button>`;
  return `<div class="grp"><span class="lbl">Layout</span>${b(S.layout === 'prop', 'Proposed', 'layout:prop')}${b(S.layout === 'today', 'Today', 'layout:today')}</div>
    <div class="grp"><span class="lbl">Identity</span>${b(S.id === 'num', 'Number tab <span class="rec">· rec.</span>', 'id:num')}${b(S.id === 'colour', 'Colour only', 'id:colour')}</div>
    <div class="grp"><span class="lbl">Chip lights</span>${b(S.lights === 'dot', 'Note dot', 'lights:dot')}${b(S.lights === 'meters', 'Meters', 'lights:meters')}</div>
    <div class="grp"><span class="lbl">Select</span>${b(S.sel === 0, 'Pulse I · folded', 'sel:0')}${b(S.sel === 2, 'Mallet I · open', 'sel:2')}</div>
    <div class="grp"><span class="lbl">Screen</span>${Object.entries(SCREENS).map(([k, v]) => b(S.screen === k, v.label, 'screen:' + k)).join('')}</div>
    <div class="grp"><span class="lbl">UI zoom</span>${[1, 1.25, 1.5].map((z) => b(S.zoom === z, Math.round(z * 100) + '%', 'zoom:' + z)).join('')}</div>
    <div class="grp"><span class="lbl">View</span>${b(S.fit, 'Fit', 'fit')}${b(!S.fit, '1:1', 'fit')}${b(S.notes, 'Notes', 'notes')}</div><span class="scale" id="scale"></span>`;
}
function render() {
  document.body.classList.toggle('solo', S.solo);
  const sc = SCREENS[S.screen];
  document.getElementById('tb').innerHTML = toolbar();
  const saved = { num: TODAY_LEFT - (20 + 4 + PART_ROW + 8), colour: TODAY_LEFT - (3 + 4 + PART_ROW + 8) };
  const notes = document.getElementById('notes');
  notes.innerHTML = notesHtml(saved);
  notes.style.display = S.notes ? '' : 'none';
  const screen = document.getElementById('screen');
  const keep = screen.querySelector('.lanes-scroll')?.scrollLeft ?? 0, keepY = screen.scrollTop;
  screen.style.width = sc.w + 'px'; screen.style.height = sc.h + 'px';
  const cssW = Math.round(sc.w / S.zoom), cssH = Math.round(sc.h / S.zoom);
  screen.innerHTML = `<div class="z" style="zoom:${S.zoom};width:${cssW}px;min-height:${cssH}px">${header()}${song()}</div>`;
  const ls = screen.querySelector('.lanes-scroll'); ls.scrollLeft = keep; screen.scrollTop = keepY;
  for (const strip of screen.querySelectorAll('.pstrip')) {
    const s2 = strip.querySelector('.pscroll');
    strip.classList.toggle('over', s2.scrollWidth > s2.clientWidth + 1);
  }
  if (S.full) screen.style.height = screen.scrollHeight + 'px';
  fit();
  tickMeters();
  const lanes = screen.querySelector('.lanes'), tl = lanes.querySelector('.tls');
  const left = tl.getBoundingClientRect().left - lanes.getBoundingClientRect().left;
  const leftCss = Math.round(left / (S.zoom * stageScale()));
  const gain = TODAY_LEFT - leftCss;
  document.getElementById('cap').innerHTML = `${sc.label} · zoom ${Math.round(S.zoom * 100)}% (${cssW}×${cssH} CSS px) · ${S.layout === 'prop' ? 'Proposed, ' + (S.id === 'num' ? 'number tab' : 'colour only') : 'Today'} · timeline starts ${leftCss} px in (today ${TODAY_LEFT}) · <b>timeline +${gain} px</b> (≈ ${(gain / BAR).toFixed(1)} bars at this zoom) · content height ${screen.scrollHeight}px`;
}
function stageScale() { const sc = SCREENS[S.screen]; return S.fit ? Math.min(1, (window.innerWidth - 32) / sc.w) : 1; }
function fit() {
  const sc = SCREENS[S.screen], stage = document.getElementById('stage'), s = stageScale();
  stage.style.transform = `scale(${s})`; stage.style.width = sc.w + 'px'; stage.style.height = sc.h * s + 'px';
  if (S.full) stage.style.height = document.getElementById('screen').offsetHeight * s + 'px';
  const el = document.getElementById('scale'); if (el) el.textContent = `shown at ${Math.round(s * 100)}%`;
}
document.getElementById('tb').addEventListener('click', (e) => {
  const a = e.target.closest('button')?.dataset.act; if (!a) return;
  const [k, v] = a.split(':');
  if (k === 'layout') S.layout = v; else if (k === 'id') S.id = v; else if (k === 'lights') S.lights = v;
  else if (k === 'sel') S.sel = Number(v); else if (k === 'screen') S.screen = v; else if (k === 'zoom') S.zoom = Number(v);
  else if (k === 'fit') S.fit = !S.fit; else if (k === 'notes') S.notes = !S.notes;
  render();
});
// Live in the frame: ▸ folds, a chip / part row / lane selects, a lit red light clears.
document.getElementById('screen').addEventListener('click', (e) => {
  const t = e.target;
  const f = t.closest('[data-fold]');
  if (f) { const p = PARTS[Number(f.dataset.fold)]; p.open = !p.open; render(); return; }
  const c = t.closest('[data-clip]');
  if (c && clip[c.dataset.clip]) { delete clip[c.dataset.clip]; render(); return; }
  const s = t.closest('[data-chip]') || t.closest('[data-sel]');
  if (s) { S.sel = Number(s.dataset.chip ?? s.dataset.sel); render(); }
});
window.addEventListener('resize', () => { fit(); });
document.fonts.ready.then(render); render();
</script>
</body>
