# Every pull request and every push to main runs the same gate as
# `npm run verify` locally. A push to main that passes also publishes the
# built console to GitHub Pages. PR jobs never hold a write-capable token:
# only the deploy job, which runs on main alone, is granted Pages writes.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.claude/**', '**/*.md']
  # Every PR runs the workflow so the required `verify` check always
  # reports; a docs-only PR skips the heavy steps and passes in seconds.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Never-track guard
        run: |
          if git ls-files | grep -Eq '(^|/)(\.env|.*\.kubeconfig)$'; then
            echo "tracked file matching the never-track pattern" >&2
            exit 1
          fi
      - name: Does the diff touch code?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
            if git diff --name-only "$base" HEAD | grep -Evq '^(docs/|\.claude/|.*\.md$)'; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "docs-only diff: skipping the gate"
            fi
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        run: npm ci --no-audit --fund=false
      - if: steps.changes.outputs.code == 'true'
        run: npm run verify
      # verify ends with `vite build`; its relative base serves from the
      # project-site path (/windsor/) without a rebuild.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/app/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
