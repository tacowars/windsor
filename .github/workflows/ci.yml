# Every pull request and every push to main runs the same gate as
# `npm run verify` locally. The site is served by GitHub Pages from the
# `gh-pages` branch: a push to main that passes publishes the build to the
# branch root, and a code PR from this repo publishes its build to
# `pr-preview/pr-<N>/` (docs/log/2026-09-28-pr-previews-on-github-pages.md).
#
# The security boundary: `verify` checks out and runs the PR's code with a
# read-only token and hands the build over as a workflow artifact. The jobs
# that hold a write token (`deploy`, `preview`, `preview-remove`) never check
# out or run the PR's code: they download that artifact and push files.
#
# Three writers share `gh-pages`, and they are not all serialised under one
# concurrency group. Such a group holds only one pending run, and a newer
# one cancels it, so a burst of PR pushes could drop main's deploy. Instead:
# - Each writer's group is scoped to its own content: `gh-pages-main` for
#   main, and `gh-pages-pr-<N>` for a PR's preview and its removal. Only a
#   newer run for the same content can supersede a pending one.
# - Writers in different groups may push at the same moment. Every writer
#   runs the deploy action with `force: false`, so a rejected push fetches
#   the branch, rebases onto it and pushes again, up to `attempt-limit`
#   times (3 by default, 5 for main). The writers touch disjoint paths (the
#   root excluding pr-preview/, and pr-preview/pr-<N>/), so the rebase
#   cannot conflict.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.claude/**', '**/*.md']
  # Every PR runs the workflow so the required `verify` check always
  # reports; a docs-only PR skips the heavy steps and passes in seconds.
  # `closed` only removes the PR's preview.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Never-track guard
        run: |
          if git ls-files | grep -Eq '(^|/)(\.env|.*\.kubeconfig)$'; then
            echo "tracked file matching the never-track pattern" >&2
            exit 1
          fi
      - name: Does the diff touch code?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
            if git diff --name-only "$base" HEAD | grep -Evq '^(docs/|\.claude/|.*\.md$)'; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "docs-only diff: skipping the gate"
            fi
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        run: npm ci --no-audit --fund=false
      - if: steps.changes.outputs.code == 'true'
        run: npm run verify
      # verify ends with `vite build`; its relative base serves the same
      # dist/ from the site root and from any pr-preview/pr-<N>/ folder.
      - if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: packages/app/dist
          retention-days: 7

  # main's build goes to the root of `gh-pages`, keeping every open PR's
  # preview under pr-preview/.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One main deploy at a time. A newer pending main deploy supersedes an
    # older pending one, and the newest build is the one the site should
    # show. A preview never shares this group, so it can't drop a main deploy.
    concurrency:
      group: gh-pages-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # Pages would otherwise run Jekyll over the branch, which drops any
      # file whose name starts with `_`.
      - run: touch site/.nojekyll
      # The deploy action needs a git repository in the workspace to build
      # its worktree in; an empty one keeps any source out of this job.
      - name: Seed an empty repository
        run: |
          git init -q
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m seed
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean: true
          clean-exclude: pr-preview/
          # A rejected push fetches gh-pages, rebases onto a concurrent
          # preview push and pushes again, instead of overwriting it.
          force: false
          attempt-limit: 5

  # A code PR from this repo gets its build at pr-preview/pr-<N>/ and a
  # sticky comment with the URL. Forks and docs-only PRs get neither.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.verify.outputs.code == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Shared with this PR's removal, so only a newer run for the same PR can
    # supersede it. pr-preview-action pushes through JamesIves v4.7.4 with
    # `force: false`, which retries a rejected push with the same
    # fetch-and-rebase loop, up to 3 attempts.
    concurrency:
      group: gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Seed an empty repository
        run: |
          git init -q
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m seed
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: deploy
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: 'false'

  # Deletes the PR's preview folder when the PR is closed or merged, or when
  # a push leaves it docs-only (verify says code=false), so no stale build
  # stays linked. On `closed`, verify is skipped, hence `!cancelled()`
  # rather than the implicit success() gate. It does nothing, and posts no
  # comment, when the folder doesn't exist.
  preview-remove:
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.verify.outputs.code == 'false')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Is there a preview to remove?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # Only a 404 means "absent". Any other failure (5xx, rate limit,
        # auth) fails the job so it shows red and can be re-run, rather than
        # passing with the preview left in place.
        run: |
          if out=$(gh api "repos/$REPO/contents/pr-preview/pr-$PR?ref=gh-pages" --silent 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no preview folder for PR $PR: nothing to remove"
          else
            echo "$out" >&2
            echo "::error::could not check for the preview folder of PR $PR"
            exit 1
          fi
      - if: steps.existing.outputs.exists == 'true'
        name: Seed an empty repository
        run: |
          git init -q
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m seed
      - if: steps.existing.outputs.exists == 'true'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: 'false'
