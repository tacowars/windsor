# Every pull request and every push to main runs the same gate as
# `npm run verify` locally. A push to main that passes also publishes the
# built console to GitHub Pages. PR jobs never hold a write-capable token:
# only the deploy job, which runs on main alone, is granted Pages writes.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.claude/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '.claude/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Never-track guard
        run: |
          if git ls-files | grep -Eq '(^|/)(\.env|.*\.kubeconfig)$'; then
            echo "tracked file matching the never-track pattern" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run verify
      # verify ends with `vite build`; its relative base serves from the
      # project-site path (/windsor/) without a rebuild.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/app/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
