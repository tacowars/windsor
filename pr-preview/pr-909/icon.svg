<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Windsor's Home Screen icon (windsor#888): the mark from favicon.svg,
       full bleed on an opaque square with no border or rounded corners
       (iPadOS masks the corners itself). The mark reaches 20.2 units from
       its centre; at 9x that is 182 px, inside the maskable safe circle
       (80% of 512, a 205 px radius).
       Render the committed PNGs from this folder with:
         rsvg-convert -w 180 -h 180 -b '#0c0f10' icon.svg -o apple-touch-icon.png
         rsvg-convert -w 192 -h 192 -b '#0c0f10' icon.svg -o icon-192.png
         rsvg-convert -w 512 -h 512 -b '#0c0f10' icon.svg -o icon-512.png -->
  <rect width="512" height="512" fill="#0c0f10"/>
  <g transform="translate(256 256) scale(9) translate(-22 -22)">
    <path d="M5 22 C 9 13, 13 13, 17 22 S 25 31, 29 22 S 37 13, 41 22" fill="none" stroke="#5fa8a0" stroke-width="1.4" opacity="0.7"/>
    <polyline points="8,11 15,33 22,17 29,33 36,11" fill="none" stroke="#e0a44e" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="15" cy="33" r="2.4" fill="#e0a44e"/><circle cx="22" cy="17" r="2.4" fill="#e0a44e"/>
    <circle cx="29" cy="33" r="2.4" fill="#e0a44e"/><circle cx="36" cy="11" r="2.4" fill="#e0a44e"/>
  </g>
</svg>
