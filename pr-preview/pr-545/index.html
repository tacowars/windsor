<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windsor</title>
    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <script type="module" crossorigin src="./assets/index-DCSMlxM0.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DkzhfN8U.css">
  </head>
  <body>
    <div class="console">
      <div class="chrome">
        <header class="head">
          <div class="head-row">
            <nav class="tabs" id="tabBar" aria-label="Console tabs"></nav>
            <button class="btn primary" id="power" type="button">Enable audio</button>
            <div
              class="undo-controls"
              id="undoControls"
              role="group"
              aria-label="Undo history"
            ></div>
            <section class="transport-strip" id="transportStrip" aria-label="Transport"></section>
          </div>
          <section class="part-strip" id="partStrip" aria-label="Parts"></section>
        </header>
      </div>
      <main class="tab-root" id="tabRoot"></main>
    </div>
    <section class="toasts" id="toasts" aria-label="Notifications" aria-live="polite"></section>

    <dialog id="jsonDlg">
      <div class="dlg-body">
        <div class="section-title" style="margin: 0"><span>Patch JSON</span></div>
        <p class="hint" style="margin: 0">
          The working patch of the selected part, as the document's <kbd>patches</kbd> section
          stores it. Paste a patch (an older standalone export included) and press Load to put it in
          the document under this part's patch name; Export in Settings carries it.
        </p>
        <textarea id="jsonText" spellcheck="false" aria-label="Patch JSON"></textarea>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button class="btn primary" id="jsonCopy" type="button">Copy</button>
          <button class="btn" id="jsonLoad" type="button">Load</button>
          <button class="btn" id="jsonClose" type="button">Close</button>
          <span class="status" id="jsonStatus"></span>
        </div>
      </div>
    </dialog>

    <!-- The library workflow's modals (#563): metadata for Save / Copy to new,
         and the page's own confirm. Never window.confirm. -->
    <dialog id="metaDlg" aria-labelledby="metaTitle">
      <div class="dlg-body">
        <div class="section-title" style="margin: 0"><span id="metaTitle">Save patch</span></div>
        <p class="hint" id="metaHint" style="margin: 0"></p>
        <label class="field-label" for="metaName">Display name</label>
        <input class="field" id="metaName" name="patch-display-name" autocomplete="off" />
        <p class="hint hot" id="metaNameProblem" role="alert" style="margin: 0"></p>
        <label class="field-label" for="metaId">Id (the file name)</label>
        <input class="field" id="metaId" name="patch-id" readonly aria-readonly="true" />
        <label class="field-label" for="metaCategory">Category</label>
        <select class="field" id="metaCategory" name="patch-category"></select>
        <input
          class="field"
          id="metaNewCategory"
          name="patch-new-category"
          placeholder="New category name"
          aria-label="New category"
          hidden
        />
        <label class="field-label" for="metaTagInput">Tags</label>
        <div class="chips" id="metaTags"></div>
        <input
          class="field"
          id="metaTagInput"
          name="patch-tag"
          list="metaTagList"
          placeholder="Type a tag; Enter or comma adds it"
          autocomplete="off"
        />
        <datalist id="metaTagList"></datalist>
        <label class="field-label" for="metaDescription">Description</label>
        <textarea
          class="field meta-text"
          id="metaDescription"
          name="patch-description"
          rows="3"
        ></textarea>
        <p class="hint" id="metaLoudness" role="status" style="margin: 0"></p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button class="btn primary" id="metaConfirm" type="button">Write</button>
          <button class="btn" id="metaCancel" type="button">Cancel</button>
        </div>
      </div>
    </dialog>

    <dialog id="confirmDlg" aria-labelledby="confirmTitle">
      <div class="dlg-body">
        <div class="section-title" style="margin: 0"><span id="confirmTitle"></span></div>
        <p class="hint" id="confirmBody" style="margin: 0"></p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button class="btn primary" id="confirmOk" type="button">OK</button>
          <button class="btn" id="confirmCancel" type="button">Cancel</button>
        </div>
      </div>
    </dialog>

  </body>
</html>
